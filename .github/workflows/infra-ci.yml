name: Infrastructure CI

# Runs only when Terraform changes. Validate-only: no cloud credentials needed.
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/infra-ci.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/infra-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      # -backend=false validates without remote state or cloud credentials.
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate
