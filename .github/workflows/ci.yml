name: CI

# Feature branches are gated through their pull request; main additionally runs
# on merge and is the only branch that produces the `latest` image tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # `build` -> `check` compiles, runs the unit + integration tests, and runs
      # Checkstyle (wired by the uk.gov.hmcts.java plugin). One task, three gates.
      - name: Build, test and Checkstyle
        run: ./gradlew build

  image-scan:
    name: Image build & Trivy scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      # Short SHA gives an immutable, traceable tag from image back to commit.
      - name: Derive image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t test-backend:${{ steps.meta.outputs.tag }} .
          # `latest` is a convenience pointer for main only.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag test-backend:${{ steps.meta.outputs.tag }} test-backend:latest
          fi

      # Block the pipeline on fixable CRITICAL vulnerabilities.
      - name: Trivy scan — fail on CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: test-backend:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      # Report HIGH findings for visibility without failing the build.
      - name: Trivy scan — report HIGH (non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: test-backend:${{ steps.meta.outputs.tag }}
          severity: HIGH
          exit-code: '0'
          ignore-unfixed: true
          format: table

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      # -backend=false validates without remote state or cloud credentials.
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate
